  <!--
    Resolve the theme BEFORE first paint so a light-theme visitor never sees a
    dark flash (and vice versa). Keep the storage key in sync with
    ThemeService.STORAGE_KEY.
  -->
  <script>
    (function () {
      var theme = 'dark';
      try {
        var stored = localStorage.getItem('portfolio-theme');
        if (stored === 'light' || stored === 'dark') {
          theme = stored;
        } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
          theme = 'light';
        }
      } catch (e) {
        /* Storage unavailable — fall back to the dark default. */
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
